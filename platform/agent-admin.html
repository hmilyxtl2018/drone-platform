<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ontology Agent Admin</title><link rel="stylesheet" href="/agent-admin.css?v=20261118-connectors-v1"></head>
<body data-ui-version="20261119-cognitive-suite-v1">
<header><div><span class="eyebrow">ONTOLOGY · AGENT ENGINE</span><h1>Agent 工作台</h1></div><div id="identity">连接中</div><button id="signout" hidden>退出</button></header>
<main>
<section id="login" class="card" hidden aria-hidden="true"></section>
<div id="workspace" hidden>
<nav id="primary-nav" aria-label="主导航"><button data-area="agents" class="selected">Agents</button><button data-area="task">新建任务</button><button data-area="runs">执行监控</button><button data-area="audit">历史审计</button><button data-area="settings">管理设置</button></nav>
<section id="journey-agent-view" class="journey-view"></section>
<section id="journey-audit-view" class="journey-view" hidden></section>
<div id="task-run-shell" hidden><div class="layout"><aside><section class="card" id="task-card"><div class="journey-section-kicker">TASK SETUP</div><h2>创建一次 Agent 任务</h2><p class="help-note help-help">先确认 Agent Profile，再输入本次任务目标。通用控制与 Agent 专属输入分开维护。</p><form id="create-form"><section class="task-settings-group task-settings-common"><div class="task-settings-heading"><h3>任务输入</h3><span class="help-note help-info">只管理本次任务的 Agent、目标和资源上限；不会把无人机或情报领域字段混入通用表单。</span></div><label>Agent<select id="agent"></select></label><div id="selected-profile-hint" class="profile-hint"></div><label>任务目标<textarea id="question" rows="3" required placeholder="说明这次任务要回答什么，结果给谁使用"></textarea></label></section><section class="task-settings-group task-settings-runtime"><div class="task-settings-heading"><h3>资源预算</h3><span class="help-note help-help">仅设置本次 Run 的资源上限，不会修改已发布 Profile；最终上限仍由服务端校验。</span></div><input id="metrics" type="hidden" value="enduranceHours,payloadKg"><label>模型调用上限<input id="model-budget" type="number" min="1" max="24" value="12" required></label><label>搜索上限<input id="search-budget" type="number" min="0" max="20" value="4" required></label><label>抓取上限<input id="scrape-budget" type="number" min="0" max="20" value="4" required></label></section><div id="entity-picker" class="task-settings-specific"></div><input id="entity" type="hidden"><button type="submit" disabled>提交并入队</button></form></section><section class="card" id="run-history-card"><div class="title-row"><h2>最近运行</h2><button id="refresh">刷新</button></div><div id="runs"></div></section></aside>
<article><section class="card" id="task-context-card" hidden></section><section class="card" id="run-status-card"><div class="title-row"><h2 id="run-title">选择一次运行</h2><span id="run-status" class="badge"></span></div><div id="controls" hidden><button data-control="pause">暂停</button><button data-control="resume">继续</button><button data-control="cancel" class="danger">取消</button></div><div id="summary"></div><p id="run-link"></p></section>
<nav id="tabs" aria-label="当前工作区"><div class="tab-group" data-tab-group="runs"><button data-tab="graph" class="selected">执行图</button><button data-tab="workspaces">研究工作区</button><button data-tab="report">报告</button><button data-tab="plans">计划</button><button data-tab="evidence">证据与审核</button><button data-tab="budget">预算与调用</button><button data-tab="engineering">需求与计算</button><button data-tab="traceability">验证追溯</button><button data-tab="knowledge">知识版本</button><button data-tab="events">运行事件</button></div><div class="tab-group" data-tab-group="settings"><button data-tab="config">Profile 与工具</button><button data-tab="connectors">连接器</button><button data-tab="evaluation">版本评测</button><button data-tab="operations">运行健康</button><button data-tab="identities">用户与权限</button></div></nav>
<section class="card" id="panel"></section>
<section class="card" id="followup-section" hidden><details><summary>补材料后重新研究</summary><p class="followup-cost">新增关联 Run，使用新预算，可能产生模型与采集调用。</p><form id="followup-form"><label>补充材料或新的问题<textarea id="followup-material" rows="3" maxlength="30000" required></textarea></label><button>创建后续任务并入队</button></form></details></section></article></div></div></div>
<p id="message" role="status" aria-live="polite"></p>
</main><script src="/agent-graph-core.js?v=20261116-stable-monitor-v2" defer></script><script src="/agent-admin-phase4.js?v=20261030-agent-settings-contracts-r2" defer></script><script src="/agent-admin-workspaces.js?v=20261030-agent-settings-contracts-r2" defer></script><script src="/agent-review-workbench.js?v=20261030-agent-settings-contracts-r2" defer></script><script src="/agent-admin-connectors.js?v=20261118-connectors-v1" defer></script><script src="/agent-admin-config.js?v=20261114-skill-b3" defer></script><script src="/agent-admin-knowledge.js?v=20261030-agent-settings-contracts-r2" defer></script><script src="/agent-admin-engineering.js?v=20261030-agent-settings-contracts-r2" defer></script><script src="/agent-admin-evaluation.js?v=20261030-agent-settings-contracts-r2" defer></script><script src="/agent-admin-operations.js?v=20261030-agent-settings-contracts-r2" defer></script><script src="/agent-admin-reasoning.js?v=20261104-reasoning-harness-r1" defer></script><script src="/agent-admin-skills.js?v=20261114-skill-b3" defer></script><script src="/agent-admin-graph.js?v=20261118-connectors-v1" defer></script><script src="/agent-admin-targets.js?v=20261114-decision-semantics-v3" defer></script><script src="/agent-admin-baseline.js?v=20261116-uav-role-drafts-v1" defer></script><script src="/agent-admin-report-graph.js?v=20261116-graph-core-v1" defer></script><script src="/agent-admin-review.js?v=20261114-agent-definition-r2" defer></script><script src="/agent-admin-verification.js?v=20261114-verification-v1" defer></script><script src="/agent-admin-cognitive.js?v=20261119-cognitive-suite-v1" defer></script><script src="/agent-admin.js?v=20261118-connectors-v1" defer></script>
</body></html>
