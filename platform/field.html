<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Ontology based Agent 作战协同</title>
    <link rel="stylesheet" href="./space.css?v=31" />
    <link rel="stylesheet" href="./field.css?v=14" />
  </head>
  <body data-compose>
    <canvas id="world" aria-label="Ontology based Agent 作战协同"></canvas>

    <aside class="panel left" aria-label="Ontology based Agent 作战协同">
      <div class="mast">
        <img class="brand" src="./img/logo-lingyunzhi.jpg" alt="灵云智 Industry Meta" />
        <h1>Ontology based Agent 作战协同</h1>
      </div>
    </aside>

    <aside class="dock" aria-label="交战本体">
      <button type="button" class="drawer" aria-expanded="true" aria-label="收起">&gt;</button>
      <section class="pane">
        <h2 class="pane-h">本波影 <b id="wave-lab"></b></h2>
        <div id="body"></div>
      </section>
      <section class="pane pane-pick">
        <h2 class="pane-h">选中</h2>
        <div id="detail" class="detail" aria-live="polite"></div>
      </section>
      <section class="pane pane-eye">
        <h2 class="pane-h">鹰眼 <b id="eye-lab"></b></h2>
        <canvas id="eye" aria-label="交战本体示意图"></canvas>
      </section>
    </aside>

    <p id="caption" class="caption"></p>
    <p class="legend" id="legend">
      <button type="button" data-kind="gold">金线 · 队影合成</button>
      <button type="button" data-kind="form">编队 · 同层阵位</button>
      <button type="button" data-kind="pair">盯梢 · 谁盯谁</button>
      <button type="button" data-kind="gate">授权 · 过门许可</button>
    </p>

    <nav class="bar">
      <button id="play" type="button">演</button>
      <span id="freeze" class="freeze" hidden>冻 · 后台已暂停，点演继续</span>
      <button id="wave" type="button">下一波</button>
      <button id="reset" type="button">复位</button>
      <span class="rule"></span>
      <button type="button" data-inject="jam">拒止</button>
      <button type="button" data-inject="restore">复通</button>
      <button type="button" data-inject="attrition">减员</button>
      <span class="rule"></span>
      <a class="quiet" href="./space.html">岸海态势</a>
      <a class="quiet" href="./cop.html">平面图</a>
      <a class="quiet" href="./swarm.html">球面码</a>
      <a class="quiet" href="./kb.html">知识库</a>
      <a class="quiet on" href="./field.html">Ontology based Agent 作战协同</a>
      <img class="brand" src="./img/logo-mark.jpg" alt="灵云智" />
    </nav>

    <script>
      if (location.protocol === "file:") {
        document.write(
          "<div style='position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;background:#0b0e14;color:#ece6d4;font:16px/1.7 Segoe UI,PingFang SC,sans-serif;text-align:center'>不要双击本地 html。<br>请打开 <b style='color:#e2c36a'>http://127.0.0.1:8765/field.html</b></div>",
        );
      }
    </script>
    <script type="module" src="./field.js?v=13"></script>
  </body>
</html>
